name: Code quality and tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: PHP ${{ matrix.php }} / TYPO3 14.3
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, intl, mbstring, pdo_sqlite, sqlite3, xml
          tools: composer:v2
          coverage: none
      - name: Validate package
        run: composer validate --strict
      - name: Install development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHPCS, PHP-CS-Fixer, PHPStan and HTTP tests
        run: composer check
